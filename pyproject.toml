[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crowd-signal"
version = "0.1.0"
description = "Reproducible HKEX / KRX crowd sentiment research, with explicit evidence and validation."
requires-python = ">=3.11,<3.15"
dependencies = [
  "apify-client>=2.5.1,<3",
  "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0.2,<7",
  "rich>=13.9,<15",
  "typer>=0.16,<1",
  "tzdata>=2025.1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pyarrow>=19,<24",
  "scikit-learn>=1.5.2,<2",
  "plotly>=5.24,<7",
  "yfinance>=0.2.66,<2",
  "exchange-calendars>=4.11,<5",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
pipeline = []

[project.scripts]
crowd-signal = "crowd_signal.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crowd_signal = ["templates/*.html", "templates/*.js", "templates/*.j2", "templates/*.txt", "templates/*.css", "templates/vendor/*", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

